[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "truffles"
version = "0.3.0"
description = "A small, composable harness for LangChain agents, LangGraph workflows, and RAG."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "langchain>=1.4.6,<2",
  "langchain-core>=1.6.12,<2",
  "langgraph>=1.2.16,<2",
  "langchain-text-splitters>=1.1.3,<2",
]

[project.optional-dependencies]
ocr = ["Pillow>=11,<14", "pytesseract>=0.3.13,<0.4"]
pdf = ["pypdfium2>=5,<6"]
tables = ["truffles[ocr,pdf]", "img2table==2.0.0; python_version < '3.15'"]
processing = ["truffles[ocr,pdf,audio]"]
openai = ["langchain-openai>=1.7.2,<2"]
audio = ["openai>=2,<4"]
anthropic = ["langchain-anthropic>=1.7.6,<2"]
gemini = ["langchain-google-genai>=4.4.2,<5"]
groq = ["langchain-groq>=1.1.3,<2"]
xai = ["langchain-xai>=1.3,<2"]
perplexity = ["langchain-perplexity>=1.4.1,<2"]
providers = ["truffles[openai,anthropic,gemini,groq,xai,perplexity]"]
memory = ["numpy>=1.26,<3"]
qdrant = ["langchain-qdrant>=1.1,<2"]
chroma = ["langchain-chroma>=1,<2"]
pinecone = ["langchain-pinecone>=0.2,<2"]
weaviate = ["langchain-weaviate>=0.0.5,<1"]
milvus = ["langchain-milvus>=0.2,<1"]
postgres = ["langchain-postgres>=0.0.16,<1"]
redis = ["langchain-redis>=0.2,<1"]
faiss = ["langchain-community>=0.4,<1", "faiss-cpu>=1.9,<2"]
elasticsearch = ["langchain-elasticsearch>=0.3,<2"]
cohere = ["langchain-cohere>=0.4,<1"]
huggingface = ["langchain-huggingface>=1,<2", "sentence-transformers>=3,<6"]
fastembed = ["langchain-community>=0.4,<1", "fastembed>=0.5,<1"]

[dependency-groups]
dev = ["pytest>=9,<10", "pytest-asyncio>=1,<2", "pytest-cov>=7,<8", "pytest-socket>=0.7,<1", "ruff>=0.17,<1", "build>=1,<2", "respx>=0.23,<1", "httpx>=0.28,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/truffles"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--disable-socket --allow-unix-socket --strict-markers"
markers = ["contract: real provider adapters with stubbed transports", "integration: local vector store and runtime integration"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.coverage.run]
source = ["truffles"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.ruff.lint.per-file-ignores]
"apps/pfm/src/truffles_pfm/api.py" = ["B008"] # FastAPI dependency injection defaults
